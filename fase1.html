<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 1 - Desafio de Criptografia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Desafio de Criptografia</h1>
            <p id="nomeUsuario"></p>
        </header>

        <div class="card">
            <div class="fase-info">
                <strong>Fase 1 — Nível Fácil</strong><br>
                Tentativas restantes: <span id="tentativas">3</span>
            </div>

            <h2>Mensagem Criptografada:</h2>
            <div class="codigo-mensagem">ifitx gjr izfwitx janyfr uwtgqjrfx</div>

            <p><strong>Dica:</strong> A chave de deslocamento é 5</p>

            <label for="resposta">Qual é a frase original?</label>
            <input type="text" id="resposta" placeholder="Digite a frase aqui..." style="width: 100%;">
            
            <div class="botoes">
                <button class="btn btn-principal" onclick="verificarResposta()">Enviar Resposta</button>
            </div>

            <div id="mensagemArea"></div>
        </div>
    </div>

    <script>
        const respostaCorreta = "dados bem guardados evitam problemas";
        let tentativas = 3;
        
        document.getElementById('nomeUsuario').textContent = 
            localStorage.getItem('nomeGrupo') ? `Grupo: ${localStorage.getItem('nomeGrupo')}` : '';

        function verificarResposta() {
            const resposta = document.getElementById('resposta').value.trim().toLowerCase();
            const area = document.getElementById('mensagemArea');
            tentativas--;
            document.getElementById('tentativas').textContent = tentativas;

            if (resposta === respostaCorreta) {
                area.innerHTML = `<div class="mensagem sucesso">✅ Você acertou!<br>Siga para a próxima fase.</div>`;
                localStorage.setItem('fase1Concluida', 'true');
                setTimeout(() => {
                    window.location.href = 'fase2.html';
                }, 2000);
            } else if (tentativas > 0) {
                area.innerHTML = `<div class="mensagem erro">❌ Tente de novo!<br><em>Dica: cada letra foi trocada por outra 5 posições à frente no alfabeto.</em></div>`;
            } else {
                area.innerHTML = `<div class="mensagem erro">😔 Suas tentativas acabaram. A resposta era: <strong>${respostaCorreta}</strong><br><a href="fase1.html" style="color:red;">Tentar novamente</a></div>`;
                document.querySelector('.btn-principal').disabled = true;
            }
        }
    </script>
</body>
</html>
