<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Resultados - Desafio de Criptografia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Painel de Resultados</h1>
            <p>Acompanhe o progresso e veja os vencedores!</p>
        </header>

        <div class="card">
            <h2>📊 Progresso dos Grupos</h2>
            <table class="tabela">
                <thead>
                    <tr>
                        <th>Grupo/Pessoa</th>
                        <th>Fase Atual</th>
                        <th>Tempo Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaGrupos">
                    <tr>
                        <td colspan="4" style="text-align:center;">Nenhum grupo cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>🥇 Pódio — Mais Rápidos!</h2>
            <div id="podioArea">
                <p style="text-align:center; color:#666;">Aguardando conclusão dos grupos...</p>
            </div>
        </div>

        <div class="botoes" style="justify-content:center;">
            <a href="index.html" class="btn btn-voltar">← Voltar ao Início</a>
            <button class="btn btn-secundario" onclick="limparDados()">🗑️ Limpar Dados (Professores)</button>
        </div>
    </div>

    <script>
        function formatarTempo(segundos) {
            if (!segundos) return '--';
            const min = Math.floor(segundos / 60);
            const seg = segundos % 60;
            if (min > 0) return `${min}m ${seg}s`;
            return `${seg}s`;
        }

        function carregarDados() {
            const grupos = JSON.parse(localStorage.getItem('grupos') || '[]');
            const tabela = document.getElementById('tabelaGrupos');
            const podioArea = document.getElementById('podioArea');

            // Tabela de progresso
            if (grupos.length === 0) {
                tabela.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhum grupo cadastrado ainda.</td></tr>`;
            } else {
                tabela.innerHTML = grupos.map(g => `
                    <tr>
                        <td><strong>${g.nome}</strong></td>
                        <td>Fase ${g.fase}</td>
                        <td>${g.tempo ? formatarTempo(g.tempo) : 'Em andamento'}</td>
                        <td>${g.concluido 
                            ? '<span style="color:green;">✅ Concluído</span>' 
                            : '<span style="color:orange;">⏳ Em andamento</span>'}</td>
                    </tr>
                `).join('');
            }

            // Pódio — apenas os que concluíram, ordenados pelo menor tempo
            const concluidos = grupos.filter(g => g.concluido).sort((a, b) => a.tempo - b.tempo);
            
            if (concluidos.length >= 1) {
                podioArea.innerHTML = `<div class="podio">
                    ${concluidos[1] ? `
                    <div class="podio-item prata">
                        <div style="font-size:24px;">🥈</div>
                        <div style="font-weight:bold; margin-top:5px;">${concluidos[1].nome}</div>
                        <div style="font-size:0.9rem;">${formatarTempo(concluidos[1].tempo)}</div>
                    </div>` : '<div></div>'}
                    
                    <div class="podio-item ouro">
                        <div style="font-size:28px;">🥇</div>
                        <div style="font-weight:bold; margin-top:5px;">${concluidos[0].nome}</div>
                        <div style="font-size:0.9rem;">${formatarTempo(concluidos[0].tempo)}</div>
                    </div>
                    
                    ${concluidos[2] ? `
                    <div class="podio-item bronze">
                        <div style="font-size:24px;">🥉</div>
                        <div style="font-weight:bold; margin-top:5px;">${concluidos[2].nome}</div>
                        <div style="font-size:0.9rem;">${formatarTempo(concluidos[2].tempo)}</div>
                    </div>` : '<div></div>'}
                </div>
                <p style="text-align:center; margin-top:20px;">Total de ${concluidos.length} grupos concluídos!</p>`;
            } else {
                podioArea.innerHTML = `<p style="text-align:center; color:#666;">Aguardando grupos completarem o desafio...</p>`;
            }
        }

        function limparDados() {
            if (confirm('Tem certeza que deseja apagar todos os dados? Esta ação não pode ser desfeita!')) {
                localStorage.removeItem('grupos');
                localStorage.removeItem('nomeGrupo');
                localStorage.removeItem('faseAtual');
                localStorage.removeItem('tempoInicio');
                localStorage.removeItem('fase1Concluida');
                localStorage.removeItem('fase2Concluida');
                carregarDados();
                alert('Dados limpos com sucesso!');
            }
        }

        carregarDados();
    </script>
</body>
</html>
